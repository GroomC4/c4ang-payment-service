# ====================================
# dev 프로필 - k3d 개발환경 (Kubernetes)
# ====================================

# Platform Saga Tracker 설정
platform:
  saga:
    enabled: true  # dev 환경에서 Saga Tracker 활성화

spring:
  datasource:
    master:
      url: jdbc:postgresql://payment-db:5437/payment_db
      username:
      password:
      driver-class-name: org.postgresql.Driver
    replica:
      url: jdbc:postgresql://payment-db:5437/payment_db
      username:
      password:
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 5
  data:
    redis:
      host: cache-redis
      port: 6379
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅 활성화 (개발 환경)
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}

# ====================================
# dev 환경 로그 레벨 (k3d 개발 환경)
# ====================================
logging:
  level:
    root: INFO

    # 프로젝트 패키지 - DEBUG 레벨 (상세 개발 로그)
    com.groom.payment: DEBUG

    # Spring Framework
    org.springframework: INFO
    org.springframework.web: DEBUG

    # Hibernate/JPA - SQL 쿼리 디버깅
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  file:
    path: ./logs

# Redis 설정 (ExternalName 서비스 사용)
spring.data.redis:
  host: ${REDIS_HOST:cache-redis}
  port: ${REDIS_PORT:6379}

# Feign Client 설정 (k3d 서비스 이름 사용)
feign:
  clients:
    order-service:
      url: ${ORDER_SERVICE_URL:http://order-api:8082}
      connect-timeout: 5000
      read-timeout: 5000
      logger-level: full
  client:
    config:
      order-service:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# Kafka Topic 설정
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  schema-registry:
    url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
